<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Sambung Kata Bahasa Indonesia</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
            50% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.8); }
        }
        .urgent-timer { animation: pulse-glow 1s infinite; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Container Utama -->
    <div class="w-full max-w-2xl bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 overflow-hidden flex flex-col min-h-[600px] max-h-[90vh]">
        
        <!-- Header / Navigation Bar -->
        <header class="bg-slate-950 p-5 border-b border-slate-800 flex justify-between items-center flex-wrap gap-3">
            <div>
                <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-rose-500 to-indigo-500">
                    SAMBUNG EKOR KATA
                </h1>
                <p class="text-xs text-slate-400 font-medium">Asah Otak Bahasa Indonesia</p>
            </div>
            
            <div id="game-controls" class="flex gap-2">
                <button id="btn-mode-ai" onclick="switchMode('ai')" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition-all shadow-md hover:bg-indigo-500">
                    vs AI
                </button>
                <button id="btn-mode-pvp" onclick="switchMode('pvp')" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-700 text-slate-300 transition-all hover:bg-slate-600">
                    2 Pemain
                </button>
                <button onclick="resetGame()" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-rose-600 text-white hover:bg-rose-500 transition-all">
                    Reset
                </button>
            </div>
        </header>

        <!-- Papan Skor & Timer Info -->
        <div class="bg-slate-850 p-4 border-b border-slate-800 grid grid-cols-3 gap-4 text-center items-center">
            <!-- Pemain 1 / User -->
            <div id="card-p1" class="p-3 rounded-2xl bg-indigo-950/60 border border-indigo-500/30 transition-all">
                <p id="label-p1" class="text-xs font-bold text-indigo-400 uppercase tracking-wider">Pemain 1</p>
                <p id="score-p1" class="text-2xl font-extrabold text-white">0</p>
            </div>

            <!-- Indicator Timer & Target -->
            <div class="flex flex-col items-center justify-center">
                <div id="timer-box" class="w-14 h-14 rounded-full bg-slate-900 border-4 border-indigo-500 flex items-center justify-center font-extrabold text-xl mb-1 transition-all">
                    <span id="timer-text">15</span>
                </div>
                <div id="target-box" class="text-xs font-semibold text-amber-400 bg-amber-400/10 px-2.5 py-1 rounded-full border border-amber-400/20">
                    Awalan: <span id="required-prefix" class="font-extrabold text-amber-300 uppercase">-</span>
                </div>
            </div>

            <!-- Pemain 2 / AI -->
            <div id="card-p2" class="p-3 rounded-2xl bg-slate-900/40 border border-slate-800 transition-all opacity-60">
                <p id="label-p2" class="text-xs font-bold text-slate-400 uppercase tracking-wider">AI Bot</p>
                <p id="score-p2" class="text-2xl font-extrabold text-white">0</p>
            </div>
        </div>

        <!-- Area Obrolan Kata (Word Chain Display) -->
        <div id="chain-container" class="flex-1 p-5 overflow-y-auto custom-scrollbar flex flex-col gap-3 min-h-[250px]">
            <div id="welcome-msg" class="text-center my-auto py-8">
                <div class="w-16 h-16 bg-indigo-500/10 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                    💡
                </div>
                <h3 class="font-bold text-slate-300 mb-1">Mulai Permainan!</h3>
                <p class="text-xs text-slate-500 max-w-xs mx-auto">Ketik kata dasar Bahasa Indonesia apa saja untuk membuka permainan.</p>
            </div>
        </div>

        <!-- Input Box Area -->
        <div class="p-4 bg-slate-950 border-t border-slate-800">
            <form id="word-form" onsubmit="handleWordSubmit(event)" class="flex gap-2">
                <div class="relative flex-1">
                    <input 
                        type="text" 
                        id="word-input" 
                        placeholder="Ketik kata baru..." 
                        autocomplete="off"
                        class="w-full px-4 py-3.5 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 font-medium transition-all"
                    >
                    <div id="prefix-hint" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-500 bg-slate-800 px-2 py-1 rounded hidden">
                        Mulai: <span id="hint-text" class="text-amber-400"></span>
                    </div>
                </div>
                <button 
                    type="submit" 
                    id="submit-btn"
                    class="px-6 py-3.5 bg-gradient-to-r from-indigo-600 to-rose-600 hover:from-indigo-500 hover:to-rose-500 font-bold rounded-xl shadow-lg transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center"
                >
                    Kirim
                </button>
            </form>
            <p id="error-msg" class="text-xs text-rose-400 mt-2 font-medium h-4 transition-all opacity-0"></p>
        </div>
    </div>

    <!-- Modal Game Over -->
    <div id="gameover-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl">
            <div class="text-5xl mb-3">🏆</div>
            <h2 class="text-2xl font-extrabold text-white mb-1">Permainan Selesai!</h2>
            <p id="winner-text" class="text-indigo-400 font-semibold mb-4 text-sm"></p>
            
            <div class="bg-slate-800/50 rounded-2xl p-4 mb-6 border border-slate-700/50 flex justify-around">
                <div>
                    <p class="text-xs text-slate-400">Skor P1</p>
                    <p id="modal-score-p1" class="text-xl font-bold text-indigo-400">0</p>
                </div>
                <div class="border-r border-slate-700"></div>
                <div>
                    <p class="text-xs text-slate-400">Skor P2</p>
                    <p id="modal-score-p2" class="text-xl font-bold text-rose-400">0</p>
                </div>
            </div>

            <button onclick="resetGame(); closeModal();" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl text-white shadow-lg transition-all">
                Main Lagi
            </button>
        </div>
    </div>

    <!-- Memanggil file logika JavaScript terpisah -->
    <script src="script.js"></script>
</body>
</html>
